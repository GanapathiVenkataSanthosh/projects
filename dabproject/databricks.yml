# This is a Databricks asset bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: c28b1888-2705-4945-93ee-42e41f9836ee

include:
  - resources/*.yml
  - resources/*/*.yml


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    preset:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    
    workspace:
      host: https://adb-7405615211390744.4.azuredatabricks.net/
    variables:
      catalog: ${var.catalog}
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405615211390744.4.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/ganapathisanthosh22@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ganapathisanthosh22@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ${var.catalog}
      schema: prod
    permissions:
      - user_name: ganapathisanthosh22@gmail.com
        level: CAN_MANAGE
